name: tmp-validation-prefix-reconstruct

on:
  pull_request:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q requests tiktoken
      - name: Reconstruct exact Small-LLM validation prefix
        shell: bash
        run: |
          cat > /tmp/reconstruct.py <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import math
          import re
          import time
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Iterator
          import requests
          import tiktoken

          REPO = 'nvidia/Nemotron-ClimbMix'
          REV = '5eaa64b9c0c85b7f56af01d7dffdb0795816b12b'
          SEED = 'small-llm-climbmix-production-v1'
          SPLIT_VERSION = 'small-llm-train-validation-v1'
          VALIDATION_P = 0.001
          REGION = 256 * 1024 * 1024
          SCAN = 4 * 1024 * 1024
          FETCH = 8 * 1024 * 1024
          ACCEPTED = set(range(1, 11)) | set(range(12, 21))
          EOD = 50256
          MAX_TOKENS_BATCH = 1_000_000
          MAX_DOCS_BATCH = 1_000
          MAX_BYTES_BATCH = 16 * 1024 * 1024
          MAX_IN_FLIGHT = 16
          WORKERS = 4
          UA = 'small-llm-token-only-corpus/1.0'

          session = requests.Session()
          session.headers.update({'User-Agent': UA})

          @dataclass(frozen=True)
          class SourceFile:
              path: str
              size: int

          @dataclass(frozen=True)
          class WorkItem:
              index: int
              filename: str
              range_start: int
              range_end: int
              work_item_id: str

          @dataclass(frozen=True)
          class Document:
              source_id: str
              cluster_id: int
              tokens: tuple[int, ...]
              work_item_index: int
              record_start: int

          @dataclass(frozen=True)
          class Batch:
              work_item_index: int
              records: tuple[tuple[bool, Document], ...]
              accepted_source_tokens: int
              estimated_bytes: int

          def get_json(url: str):
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(url, timeout=60)
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last = e
                      if attempt == 5: raise
                      time.sleep(min(30, 1.5 * 2**attempt))
              raise last

          def source_files() -> list[SourceFile]:
              url = f'https://huggingface.co/api/datasets/{REPO}/tree/{REV}?recursive=false&expand=false'
              payload = get_json(url)
              page = payload if isinstance(payload, list) else payload.get('tree', [])
              out = []
              for x in page:
                  path = x.get('path')
                  if x.get('type') == 'file' and isinstance(path, str) and '/' not in path and re.fullmatch(r'part_.*\.tokenized\.jsonl', path):
                      size = x.get('size')
                      if not isinstance(size, int) or size <= 0:
                          raise RuntimeError(f'bad source size: {x}')
                      out.append(SourceFile(path, size))
              out.sort(key=lambda x: x.path)
              if len(out) != 100:
                  raise RuntimeError(f'expected 100 source files, got {len(out)}')
              return out

          def build_plan(files: list[SourceFile]) -> list[WorkItem]:
              raw = []
              for sf in files:
                  start = 0
                  while start < sf.size:
                      end = min(start + REGION, sf.size)
                      wid = f'{REV}:{sf.path}:{start}:{end}'
                      rank = hashlib.sha256(SEED.encode() + b'\0' + wid.encode()).digest()
                      raw.append((rank, wid, sf.path, start, end))
                      start = end
              raw.sort(key=lambda x: (x[0], x[1]))
              return [WorkItem(i, x[2], x[3], x[4], x[1]) for i, x in enumerate(raw)]

          class Reader:
              def __init__(self, sf: SourceFile):
                  self.sf = sf
                  self.url = f'https://huggingface.co/datasets/{REPO}/resolve/{REV}/{sf.path}'
              def read(self, off: int, length: int) -> bytes:
                  if off >= self.sf.size: return b''
                  n = min(length, self.sf.size - off)
                  end = off + n - 1
                  last = None
                  for attempt in range(6):
                      try:
                          r = session.get(self.url, headers={'Range': f'bytes={off}-{end}', 'Accept-Encoding': 'identity'}, timeout=60)
                          if r.status_code != 206:
                              raise RuntimeError(f'{self.sf.path} range {off}-{end}: status {r.status_code}')
                          cr = r.headers.get('Content-Range', '')
                          exp = f'bytes {off}-{end}/{self.sf.size}'
                          if cr != exp:
                              raise RuntimeError(f'{self.sf.path}: content-range {cr!r} != {exp!r}')
                          if len(r.content) != n:
                              raise RuntimeError(f'{self.sf.path}: short read {len(r.content)} != {n}')
                          return r.content
                      except Exception as e:
                          last = e
                          if attempt == 5: raise
                          time.sleep(min(30, 1.5 * 2**attempt))
                  raise last

          def find_floor(reader: Reader, start: int) -> int:
              pos = start
              while pos > 0:
                  lo = max(0, pos - SCAN)
                  data = reader.read(lo, pos - lo)
                  j = data.rfind(b'\n')
                  if j != -1: return lo + j + 1
                  if lo == 0: return 0
                  pos = lo
              return 0

          def owned_records(item: WorkItem, reader: Reader) -> Iterator[tuple[int, bytes]]:
              start, end = item.range_start, item.range_end
              floor = 0 if start == 0 else find_floor(reader, start)
              cursor, buf, line_start = floor, b'', floor
              while True:
                  nl = buf.find(b'\n')
                  if nl != -1:
                      line = buf[:nl]
                      if line.endswith(b'\r'): line = line[:-1]
                      if start <= line_start < end: yield line_start, line
                      used = nl + 1
                      buf = buf[used:]
                      line_start += used
                      if line_start >= end: return
                      continue
                  if line_start >= end: return
                  if line_start < start and cursor >= end: return
                  if cursor >= reader.sf.size:
                      if buf and start <= line_start < end:
                          yield line_start, buf[:-1] if buf.endswith(b'\r') else buf
                      return
                  chunk = reader.read(cursor, FETCH)
                  if not chunk:
                      if buf and start <= line_start < end:
                          yield line_start, buf[:-1] if buf.endswith(b'\r') else buf
                      return
                  buf += chunk
                  cursor += len(chunk)

          def validate(raw: bytes):
              try: obj = json.loads(raw)
              except Exception: return None
              if not isinstance(obj, dict): return None
              c = obj.get('cluster_id')
              toks = obj.get('tokens')
              if isinstance(c, bool) or not isinstance(c, int) or not (1 <= c <= 20): return None
              if not isinstance(toks, list) or not toks: return None
              if c not in ACCEPTED: return None
              for t in toks:
                  if isinstance(t, bool) or not isinstance(t, int) or not (0 <= t <= 50256): return None
              if 'token_count' in obj and (isinstance(obj['token_count'], bool) or not isinstance(obj['token_count'], int) or obj['token_count'] != len(toks)):
                  return None
              return c, tuple(toks)

          def component(s: str) -> bytes:
              b = s.encode(); return len(b).to_bytes(8, 'big') + b

          def is_val(filename: str, record_start: int) -> bool:
              material = b''.join([component(SPLIT_VERSION), component(SEED), component(REV), component(filename), record_start.to_bytes(8, 'big')])
              draw = int.from_bytes(hashlib.sha256(material).digest()[:8], 'big')
              return draw < int(VALIDATION_P * (1 << 64))

          def batches_for_item(item: WorkItem, sf: SourceFile) -> Iterator[Batch]:
              reader = Reader(sf)
              records = []
              source_tokens = estimated = 0
              for record_start, raw in owned_records(item, reader):
                  v = validate(raw)
                  if v is None: continue
                  c, toks = v
                  doc = Document(f'{REV}:{item.filename}:{record_start}', c, toks, item.index, record_start)
                  projected_tokens = source_tokens + len(toks)
                  projected_bytes = estimated + len(raw) + len(toks) * 2
                  if records and (len(records) >= MAX_DOCS_BATCH or projected_tokens > MAX_TOKENS_BATCH or projected_bytes > MAX_BYTES_BATCH):
                      yield Batch(item.index, tuple(records), source_tokens, estimated)
                      records, source_tokens, estimated = [], 0, 0
                  records.append((is_val(item.filename, record_start), doc))
                  source_tokens += len(toks)
                  estimated += len(raw) + len(toks) * 2
              if records:
                  yield Batch(item.index, tuple(records), source_tokens, estimated)

          def main():
              files = source_files()
              by_name = {x.path: x for x in files}
              plan = build_plan(files)
              print(json.dumps({'source_files': len(files), 'work_items': len(plan), 'first_work_items': [(x.index, x.filename, x.range_start, x.range_end) for x in plan[:16]]}), flush=True)

              active: list[tuple[int, Iterator[Batch]]] = []
              next_submit = 0
              while next_submit < len(plan) and len(active) < MAX_IN_FLIGHT:
                  item = plan[next_submit]
                  active.append((next_submit, batches_for_item(item, by_name[item.filename])))
                  next_submit += 1

              val_stream: list[int] = []
              docs = []
              cycle_number = 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  while active and len(val_stream) < 4097:
                      cycle_number += 1
                      cycle = tuple(active)
                      futures = [pool.submit(next, it, None) for _, it in cycle]
                      batches = []
                      finished_slots = set()
                      for (slot, _), fut in zip(cycle, futures):
                          result = fut.result()
                          if result is None: finished_slots.add(slot)
                          else: batches.append(result)
                      if finished_slots:
                          active = [e for e in active if e[0] not in finished_slots]
                      while next_submit < len(plan) and len(active) < MAX_IN_FLIGHT:
                          item = plan[next_submit]
                          active.append((next_submit, batches_for_item(item, by_name[item.filename])))
                          next_submit += 1
                      if not batches: continue
                      for ri in range(max(len(b.records) for b in batches)):
                          for b in batches:
                              if ri >= len(b.records): continue
                              flag, d = b.records[ri]
                              if not flag: continue
                              start = len(val_stream)
                              val_stream.extend(d.tokens)
                              inserted = not d.tokens or d.tokens[-1] != EOD
                              if inserted: val_stream.append(EOD)
                              docs.append({'ordinal': len(docs), 'source_id': d.source_id, 'filename': plan[d.work_item_index].filename, 'work_item_index': d.work_item_index, 'record_start': d.record_start, 'cluster_id': d.cluster_id, 'source_token_count': len(d.tokens), 'stream_start': start, 'stream_end_exclusive': len(val_stream), 'inserted_eod': inserted, 'token_ids': list(d.tokens)})
                              if len(val_stream) >= 4097: break
                          if len(val_stream) >= 4097: break

              if len(val_stream) < 4097: raise RuntimeError(f'only got {len(val_stream)} validation stream tokens')
              enc = tiktoken.get_encoding('gpt2')
              for d in docs:
                  d['text'] = enc.decode(d.pop('token_ids'))
              def tok(i): return enc.decode_single_token_bytes(val_stream[i]).decode('utf-8', errors='replace')
              checks = {'token_1718': tok(1718), 'token_2025': tok(2025), 'context_1718': enc.decode(val_stream[max(0,1680):1760]), 'context_2025': enc.decode(val_stream[max(0,1985):2065])}
              checks['matches_known_teacher_forced_examples'] = checks['token_1718'] == ' coat' and checks['token_2025'] == ' ball' and 'parg' in checks['context_1718'] and 'ballast' in checks['context_2025']
              out = {'revision': REV, 'selection_seed': SEED, 'validation_probability': VALIDATION_P, 'cycles': cycle_number, 'validation_stream_tokens': len(val_stream), 'checks': checks, 'documents': docs, 'first_4097_token_ids': val_stream[:4097]}
              Path('validation_prefix_docs.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps({'document_count': len(docs), 'cycles': cycle_number, 'checks': checks}, ensure_ascii=False), flush=True)
              if not checks['matches_known_teacher_forced_examples']:
                  raise RuntimeError('prefix oracle mismatch')

          if __name__ == '__main__': main()
          PY
          python /tmp/reconstruct.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-prefix-docs
          path: validation_prefix_docs.json
          if-no-files-found: warn
