[project]
name = "climbmix-token-mixture"
version = "1.0.0"
description = "Reproducible exact token-weighted cluster totals for the pinned NVIDIA Nemotron-ClimbMix release."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Rocco Angelella"}]
dependencies = []

[project.scripts]
climbmix-mixture = "climbmix_mixture.cli:main"
climbmix-verify = "climbmix_mixture.verify:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
